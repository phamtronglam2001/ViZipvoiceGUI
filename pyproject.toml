[project]
name = "vizipvoice"
version = "0.1.0"
description = "ViZipVoice — Vietnamese zero-shot TTS with local Gradio GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 WITH Non-Commercial Restriction (see LICENSE)" }
dependencies = [
    "torch",
    "torchaudio",
    "numpy",
    "lhotse",
    "huggingface_hub",
    "safetensors",
    "tensorboard",
    "vocos",
    "pydub",
    "gradio>=4.0",
    "soundfile",
    "cn2an",
    "inflect",
    "soe-vinorm>=0.3.2",
    "jieba",
    "pypinyin",
    "setuptools<81",
]

[project.optional-dependencies]
gui = ["slint>=1.6", "onnx>=1.16,<1.19", "onnxruntime>=1.18", "librosa"]
export = ["onnx>=1.16,<1.19", "onnxruntime>=1.18", "onnxscript", "librosa"]
onnx = ["onnx>=1.16,<1.19", "onnxruntime>=1.18", "librosa"]
onnx-gpu = ["onnxruntime-gpu>=1.18,<1.24"]
onnx-gpu-cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cufft-cu12",
]
g2p = ["sea-g2p"]
phonemize = ["piper_phonemize"]

[project.scripts]
vizipvoice-local = "local_app.app:main"
vizipvoice-onnx-local = "local_app.onnx_app:main"
vizipvoice-download = "local_app.download_model:main"
vizipvoice-export-gui = "local_app.export_app:main"
vizipvoice-export-onnx = "zipvoice.bin.export_vizipvoice_onnx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zipvoice", "local_app"]

[tool.uv.sources]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
